{% extends 'base.html' %}
<script>
function showAlert(msg, title, icon, type) {
  // Simple console + temporary toast
  console.log(`[${title}] ${msg}`);
  // Create toast
  let toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;right:20px;padding:1rem 1.5rem;border-radius:8px;color:white;z-index:9999;max-width:350px;';
  toast.style.background = type === 'success' ? '#10b981' : type === 'warning' ? '#f59e0b' : type === 'danger' ? '#ef4444' : '#3b82f6';
  toast.innerHTML = `<strong>${title}</strong><br>${msg}`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}
</script>
