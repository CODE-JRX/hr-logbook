{% extends 'base.html' %}
{% block title %}Employee List — ASIST/UA Logbook{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fas fa-users-cog"></i> Employee List</h5>
        <div>
            <a href="/add" class="btn btn-sm btn-primary">
                <i class="fas fa-plus"></i> Add Employee
            </a>
        </div>
    </div>

    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>EMPLOYEE ID</th>
                        <th>FULL NAME</th>
                        <th>DEPARTMENT</th>
                        <th class="text-end">ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in employees %}
                    <tr>
                        <td><code class="text-primary">{{ e.employee_id }}</code></td>
                        <td><span class="fw-semibold text-dark">{{ e.full_name }}</span></td>
                        <td><span class="badge bg-light text-secondary border">{{ e.department }}</span></td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a href="/edit/{{ e.id }}" class="btn btn-outline-secondary" title="Edit">
                                    <i class="fa fa-edit"></i>
                                </a>
                                <a href="/delete/{{ e.id }}" class="btn btn-outline-danger" title="Delete"
                                    onclick="return confirm('Are you sure you want to delete this employee?')">
                                    <i class="fa fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
